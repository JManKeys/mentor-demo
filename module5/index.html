// deterministically by beat id so it's stable within a session, not re-randomized
// on every render.
const SECOND_PERSPECTIVE_NUDGES = [
  "Haven't watched the second perspective yet? It's worth the extra couple minutes before you move on.",
  "Don't skip the second perspective — a couple more minutes, and it's worth hearing.",
  "There's a second surgeon's take above you haven't watched yet. Worth pulling up before you continue.",
  "Still haven't caught the second perspective? It only takes a couple minutes, and it's worth it.",
];
function getSecondPerspectiveNudge(beatId) {
  return SECOND_PERSPECTIVE_NUDGES[beatId % SECOND_PERSPECTIVE_NUDGES.length];
}

// draft — resolves the genre collision with the patient-consultation format
// used everywhere else in the series).
function ScenarioCard({ scenario, prompt, label = "SCENARIO", animClass = "slide-in" }) {
  return (
    <div className={animClass} style={{
      background: B.lightBlue,
      border: `1.5px solid ${B.blue}`,
      borderRadius: 14,
      padding: "16px", marginBottom: 16,

      </div>
      <p style={{ fontSize: 15, color: B.text, lineHeight: 1.55, marginBottom: prompt ? 10 : 0 }}>
        {scenario}
      </p>
      {prompt && (
        <p style={{ fontSize: 14, color: B.darkBlue, lineHeight: 1.5, fontWeight: 700 }}>
          {prompt}
        </p>
      )}

// ── Beat screen ───────────────────────────────────────────────────────────────
function BeatScreen({ beat, beatIndex, total, onChosen, onBack, scrollRef }) {
  const [chosen, setChosen] = useState(null);
  const [showVideo, setShowVideo] = useState(false);
  const [showVideo2, setShowVideo2] = useState(false);
  const [guess, setGuess] = useState("");
  const [guessSubmitted, setGuessSubmitted] = useState(false);
  const [hovered, setHovered] = useState(null);

  const opt = chosen !== null ? beat.options[chosen] : null;
  const isMiss = opt && (opt.quality === "miss" || opt.quality === "weak");
  const isStrong = opt && opt.quality === "strong";
  const hasTwoVideos = !!beat.videoLabel2;

  function handleChoose(idx) {
    if (chosen !== null) return;
    setChosen(idx);
    setTimeout(() => scrollTop(scrollRef), 100);
  }

  function handleReconsider() {
    setChosen(null);
    setTimeout(() => scrollTop(scrollRef), 100);
  }

  function handleSubmitGuess() {
    setGuessSubmitted(true);
    setShowVideo(true);
    setTimeout(() => scrollTop(scrollRef), 100);
  }

  function handleNext() {
    onChosen(chosen);
  }

  return (
    <div>
      <ProgressDots beatIndex={beatIndex} total={total} />
      <div style={{ fontSize: 11, color: B.midGrey, textAlign: "center", marginBottom: 20 }}>
        Topic {beatIndex + 1} of {total} · Module 5
      </div>

      {/* Scenario opens */}
      <ScenarioCard scenario={beat.scenario} prompt={beat.prompt} label={beat.scenarioLabel} animClass="slide-in" />

      {/* Options or outcome */}
      {chosen === null ? (
        <div className="slide-in-delay">
          <SectionLabel>Your approach</SectionLabel>
          {beat.options.map((opt, idx) => (
            <button
              key={idx}
              onClick={() => handleChoose(idx)}
              onMouseEnter={() => setHovered(idx)}
              onMouseLeave={() => setHovered(null)}
              style={{
                background: hovered === idx ? B.lightBlue : B.white,
                border: `1.5px solid ${hovered === idx ? B.blue : "#D8E2EE"}`,
                borderRadius: 12, padding: "14px 16px",
                marginBottom: 10, width: "100%", textAlign: "left",
                cursor: "pointer", transition: "all 0.18s ease",
                display: "flex", gap: 12, alignItems: "flex-start",
              }}
            >
              <div style={{
                width: 24, height: 24, borderRadius: "50%",
                background: hovered === idx ? B.blue : "#E2EAF4",
                color: hovered === idx ? B.white : B.blue,
                fontSize: 12, fontWeight: 700, flexShrink: 0,
                display: "flex", alignItems: "center", justifyContent: "center",
                transition: "all 0.18s ease",
              }}>{opt.label}</div>
              <span style={{ fontSize: 14, color: B.text, lineHeight: 1.5 }}>{opt.text}</span>
            </button>
          ))}
          <div style={{ marginTop: 6 }}>
            <SecondaryBtn onClick={onBack}>
              {beatIndex === 0 ? "Back to start" : "Back to previous topic"}
            </SecondaryBtn>
          </div>
        </div>
      ) : (
        <div>
          {/* Chosen option recap */}

      </div>

      <SurveyCard>
        <p style={{ fontSize: 14, fontWeight: 600, color: B.darkBlue, marginBottom: 14 }}>
          Would you recommend this event?
        </p>
        <NPSScale value={recommend} onChange={setRecommend} lowLabel="Not likely at all" highLabel="Very likely" />
      </SurveyCard>

      <SurveyCard>
        <p style={{ fontSize: 14, fontWeight: 600, color: B.darkBlue, marginBottom: 14 }}>
          When clinically appropriate, my use of these products will likely be as follows:
        </p>
        <RatingGrid
          rows={["MENTOR™ Product Portfolio"]}
          columns={usageColumns}
          values={usage}
          onChange={(row, col) => setUsage(u => ({ ...u, [row]: col }))}
        />
      </SurveyCard>

      <SurveyCard>
        <p style={{ fontSize: 14, fontWeight: 600, color: B.darkBlue, marginBottom: 14 }}>
          The faculty helped me to understand the training content:
        </p>
        <RatingGrid
          rows={facultyRows}
          columns={facultyColumns}
          values={faculty}
          onChange={(row, col) => setFaculty(f => ({ ...f, [row]: col }))}
        />
      </SurveyCard>

      <SurveyCard>
        <p style={{ fontSize: 14, fontWeight: 600, color: B.darkBlue, marginBottom: 14 }}>
          How would you rate the overall value of the event?
        </p>
        <NPSScale value={value} onChange={setValue} lowLabel="Not Valuable" highLabel="Extremely Valuable" />
      </SurveyCard>

      <PrimaryBtn onClick={handleSubmit} disabled={!canSubmit}>Submit &amp; Complete Course</PrimaryBtn>

      <div style={{ fontSize: 11, color: B.midGrey, textAlign: "center", marginTop: 20, letterSpacing: 0.5 }}>
        {PROGRAM_TITLE} · Module 5
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// APP
// ══════════════════════════════════════════════════════════════════════════════

function App() {
  // title | blackbox | disclosures | descKol | intro | beat | closing | complete | isi1 | isi2 | survey
  // Per Standard v1.7 (Section 1.7): Title/Black Box/Disclosures/Description+KOL
  // are a one-time front gate, same as Modules 1-4. The Aug 24 08/28-implemented
  // copy-approval correction moved Disclosures/byline/sale-distribution/
  // Important-Info to the front (new "disclosures" phase, right after
  // "blackbox") — same fix already applied to Modules 1-4. Module 5's
  // end-of-module sequence still departs from the M1-4 pattern: no "closed"
  // phase — the survey itself is the true terminal phase, reached via ISI
  // Screen 2's "Continue to Survey" rather than "Close Module 5."
  const [phase, setPhase] = useState("title");
  const [beatIndex, setBeatIndex] = useState(0);
  const scrollRef = useRef(null);

  function goto(nextPhase) {
    setPhase(nextPhase);
    scrollTop(scrollRef);
  }

  function start() {
    setPhase("beat");
    setBeatIndex(0);
    scrollTop(scrollRef);
  }

  function handleBeatDone() {
    scrollTop(scrollRef);
    if (beatIndex < BEATS.length - 1) {
      setBeatIndex(i => i + 1);
    } else {
      setPhase("closing");
    }
  }

  function handleBeatBack() {
    scrollTop(scrollRef);
    if (beatIndex > 0) {
      setBeatIndex(i => i - 1);
    } else {
      setPhase("intro");
    }
  }

  function handleClosingDone() {
    setPhase("complete");
    scrollTop(scrollRef);
  }

  function handleClosingBack() {
    setPhase("beat");
    setBeatIndex(BEATS.length - 1);
    scrollTop(scrollRef);
  }

  function replay() {
    setPhase("intro");
    setBeatIndex(0);
    scrollTop(scrollRef);
  }

  function handleCompleteContinue() {
    setPhase("isi1");
    scrollTop(scrollRef);
  }

  function handleIsi1Continue() {
    setPhase("isi2");
    scrollTop(scrollRef);
  }

  function handleIsi1Back() {
    setPhase("complete");
    scrollTop(scrollRef);
  }

  function handleIsi2Continue() {
    setPhase("survey");
    scrollTop(scrollRef);
  }

  function handleIsi2Back() {
    setPhase("isi1");
    scrollTop(scrollRef);
  }

  return (
    <Shell scrollRef={scrollRef}>
      {phase === "title" && <TitleScreen onContinue={() => goto("blackbox")} />}
      {phase === "blackbox" && (
        <BlackBoxScreen onContinue={() => goto("disclosures")} onBack={() => goto("title")} />
      )}
      {phase === "disclosures" && (
        <DisclosuresScreen onContinue={() => goto("descKol")} onBack={() => goto("blackbox")} />
      )}
      {phase === "descKol" && (
        <DescriptionKolScreen onContinue={() => goto("intro")} onBack={() => goto("disclosures")} />
      )}
      {phase === "intro" && <IntroScreen onStart={start} />}
      {phase === "beat" && (
        <BeatScreen
          key={beatIndex}
          beat={BEATS[beatIndex]}
          beatIndex={beatIndex}
          total={BEATS.length}
          onChosen={handleBeatDone}
          onBack={handleBeatBack}
          scrollRef={scrollRef}
        />
      )}
      {phase === "closing" && (
        <ClosingScreen onFinish={handleClosingDone} onBack={handleClosingBack} scrollRef={scrollRef} />
      )}
      {phase === "complete" && (
        <CompleteScreen onContinue={handleCompleteContinue} onReplay={replay} />
      )}
      {phase === "isi1" && (
        <ISIScreenOne onContinue={handleIsi1Continue} onBack={handleIsi1Back} />
      )}
      {phase === "isi2" && (
        <ISIScreenTwo onContinue={handleIsi2Continue} onBack={handleIsi2Back} />
      )}
      {phase === "survey" && <SurveyScreen />}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
